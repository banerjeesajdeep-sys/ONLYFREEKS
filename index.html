<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ONLYFREEKS</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <div class="page">

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <button class="sidebar-close" id="sidebarClose">×</button>

      <h2>Menu</h2>
      <a href="#" id="homeLink">Home</a>
      <a href="#" id="trendingLink">Trending</a>
      <a href="#" id="categoriesLink">Categories</a>
      <a href="#" id="favoritesLink">Favorites</a>
    </aside>

    <main class="main-content">

      <header class="top-bar">
        <button class="sidebar-toggle" id="sidebarToggle">☰</button>

        <h1 class="logo" id="siteLogo">ONLYFREEKS</h1>

        <div class="search-wrap">
          <input 
            type="text" 
            id="searchInput" 
            placeholder="Search names..."
          />
        </div>
      </header>

      <button class="back-btn" id="backBtn">← Back</button>

      <h2 class="page-title" id="pageTitle">Browse People</h2>

      <section class="gallery" id="gallery">
        <!-- Cards load from script.js -->
      </section>

    </main>

  </div>

  <!-- Image Lightbox / Zoom Viewer -->
  <div id="imageLightbox" class="image-lightbox">
    <button id="closeLightbox" class="lightbox-close">×</button>

    <button id="prevImageBtn" class="lightbox-arrow lightbox-arrow-left">‹</button>

    <div class="lightbox-image-wrap">
      <img id="lightboxImage" src="" alt="Opened gallery image" />
    </div>

    <button id="nextImageBtn" class="lightbox-arrow lightbox-arrow-right">›</button>

    <button id="zoomImageBtn" class="zoom-btn">🔍</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
