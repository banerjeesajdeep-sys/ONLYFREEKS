<!DOCTYPE html>
<html>
<head>
  <title>ONLYFREEKS</title>
  <style>
    body {
      margin: 0;
      background: #0b0b0b;
      color: white;
      font-family: Arial;
    }

    .topbar {
      padding: 20px;
      font-size: 24px;
      font-weight: bold;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 10px;
      padding: 20px;
    }

    img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 12px;
      cursor: pointer;
    }

    .viewer {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.95);
      display: none;
      justify-content: center;
      align-items: center;
    }

    .viewer img {
      max-width: 90%;
      max-height: 90%;
    }
  </style>
</head>

<body>

<div class="topbar">ONLYFREEKS</div>

<div class="grid" id="grid"></div>

<div class="viewer" id="viewer" onclick="closeViewer()">
  <img id="bigImg">
</div>

<script>
  const images = [
    "photo1.jpg",
    "photo2.jpg",
    "photo3.jpg"
  ];

  const grid = document.getElementById("grid");
  const viewer = document.getElementById("viewer");
  const bigImg = document.getElementById("bigImg");

  images.forEach(src => {
    const img = document.createElement("img");
    img.src = src;

    img.onclick = () => {
      viewer.style.display = "flex";
      bigImg.src = src;
    };

    grid.appendChild(img);
  });

  function closeViewer() {
    viewer.style.display = "none";
  }
</script>

</body>
</html>
